name: sysmon native platforms

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    name: App checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang libclang-dev libgtk-4-dev
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ext/sysmon-native/target
          key: checks-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('ext/**/Cargo.lock') }}
      - name: Build NSH nightly and select it for subsequent steps
        run: |
          scripts/setup-nightly.sh
          echo "$PWD/.nsh/bin" >> "$GITHUB_PATH"
      - name: Native module lint
        run: |
          cargo clippy --manifest-path ext/sysmon-native/Cargo.toml --all-targets --locked -- --deny warnings
          cargo fmt --manifest-path ext/sysmon-native/Cargo.toml --check
      - name: Type check, build and test
        run: |
          nsh check
          nsh build
          nsh test

  ios:
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-apple-ios, aarch64-apple-ios-sim]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo check --manifest-path ext/sysmon-native/Cargo.toml --locked --target ${{ matrix.target }}

  android:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-linux-android, x86_64-linux-android]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - run: sdkmanager 'ndk;27.2.12479018'
      - name: Check native mobile module
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          export PATH="$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"
          export CC_aarch64_linux_android=aarch64-linux-android28-clang
          export CC_x86_64_linux_android=x86_64-linux-android28-clang
          export AR_aarch64_linux_android=llvm-ar
          export AR_x86_64_linux_android=llvm-ar
          cargo check --manifest-path ext/sysmon-native/Cargo.toml --locked --target "$TARGET"
