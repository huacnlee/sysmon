[package]
name = "sysmon"
version = "0.1.5"
edition = "2024"
publish = false

[workspace]

[dependencies]
nsh-core = { git = "https://github.com/longbridge/nsh", rev = "76fa8a7fed47ea51aea01fa85bb40960be15d984" }
nsh-base = { git = "https://github.com/longbridge/nsh", rev = "76fa8a7fed47ea51aea01fa85bb40960be15d984" }
env_logger = "0.11"

[target.'cfg(not(target_os = "ios"))'.dependencies]
sysinfo = { version = "0.37", default-features = false, features = ["system", "disk", "network"] }

# iOS uses public libc/Mach APIs for this app's own task. sysinfo 0.37's
# process/network implementation references macOS-only symbols on iOS.
[target.'cfg(target_os = "ios")'.dependencies]
libc = "0.2"
dispatch2 = "0.3.1"
objc2-ui-kit = { version = "0.3.2", default-features = false, features = ["std", "UIDevice"] }
objc2-avf-audio = { version = "0.3.2", default-features = false, features = ["std", "AVAudioSession", "AVAudioSessionRoute"] }

[target.'cfg(target_os = "android")'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
nsh-platform-linux = { git = "https://github.com/longbridge/nsh", rev = "76fa8a7fed47ea51aea01fa85bb40960be15d984", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
nsh-platform-macos = { git = "https://github.com/longbridge/nsh", rev = "76fa8a7fed47ea51aea01fa85bb40960be15d984", default-features = false }

[target.'cfg(target_os = "windows")'.dependencies]
nsh-platform-windows = { git = "https://github.com/longbridge/nsh", rev = "76fa8a7fed47ea51aea01fa85bb40960be15d984", default-features = false }
