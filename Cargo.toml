[package]
name = "sysmon"
version = "0.1.1"
edition = "2024"
publish = false

[workspace]

[dependencies]
nsh-core = "0.2.0"
nsh-base = "0.2.0"
env_logger = "0.11"

[target.'cfg(not(target_os = "ios"))'.dependencies]
sysinfo = { version = "0.37", default-features = false, features = ["system", "disk", "network"] }

# iOS uses public libc/Mach APIs for this app's own task. sysinfo 0.37's
# process/network implementation references macOS-only symbols on iOS.
[target.'cfg(target_os = "ios")'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
nsh-platform-linux = { version = "0.2.0", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
nsh-platform-macos = { version = "0.2.0", default-features = false }

[target.'cfg(target_os = "windows")'.dependencies]
nsh-platform-windows = { version = "0.2.0", default-features = false }
